name: Recover exact live OG baseline

on:
  push:
    branches:
      - agent/wrangler-deployment-bootstrap
    paths:
      - '.github/workflows/recover-live-og.yml'
      - 'website/baselines/v13/source/og-zorgtechadvies.png'

permissions:
  contents: write

jobs:
  recover:
    if: github.ref == 'refs/heads/agent/wrangler-deployment-bootstrap'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact work branch
        uses: actions/checkout@v4
        with:
          ref: agent/wrangler-deployment-bootstrap
          fetch-depth: 1

      - name: Download live OG image and verify authoritative v13 identity
        shell: bash
        run: |
          set -euo pipefail
          target='website/baselines/v13/source/og-zorgtechadvies.png'
          tmp="$(mktemp)"
          curl --fail --silent --show-error --location --retry 3 --proto '=https' --tlsv1.2 \
            'https://zorgtechadvies.nl/og-zorgtechadvies.png' -o "$tmp"
          test "$(wc -c < "$tmp" | tr -d ' ')" = '42437'
          echo 'ab0fd5fff705057213dfcd6b487e2a672caa4dfe01c96273f3e7493c58705575  '"$tmp" | sha256sum --check --status
          install -m 0644 "$tmp" "$target"
          rm -f "$tmp"

      - name: Persist exact recovered baseline if changed
        shell: bash
        run: |
          set -euo pipefail
          target='website/baselines/v13/source/og-zorgtechadvies.png'
          if git diff --quiet -- "$target"; then
            echo 'Live OG already matches authoritative v13 baseline; no commit needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'repair: recover exact v13 OG asset from live site'
          git push origin HEAD:agent/wrangler-deployment-bootstrap
